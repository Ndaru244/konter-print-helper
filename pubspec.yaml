name: cetak_struk
description: "A new Flutter project."
publish_to: 'none'

version: 0.2.0+5

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.5
  provider: ^6.1.2

  blue_thermal_printer: any
  package_info_plus: ^10.2.1
  flutter_markdown_plus: ^1.0.12
  flex_color_picker: ^4.0.0
  url_launcher: ^6.3.2
dependency_overrides:
  blue_thermal_printer:
    path: packages/blue_thermal_printer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  flutter_lints: ^6.0.0

flutter_native_splash:
  # Pre-Android 12 (color + centered image). See https://pub.dev/packages/flutter_native_splash
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/icon/splash_icon.png
  image_dark: assets/icon/splash_icon.png
  android: true
  ios: false
  web: false
  fullscreen: false
  android_gravity: center

  # Android 12+ is separate: window color + center icon (+ optional icon plate).
  # With icon_background_color, prefer ~960x960 logo; package will scale assets.
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/icon/splash_icon_android12.png
    image_dark: assets/icon/splash_icon_android12.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # Solid white PNG background (not a color resource) so OEMs keep the plate.
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"
  # White full-bleed + padded logo baked into foreground so plate shows even if
  # a launcher ignores/replaces the adaptive background layer (themed icons).
  adaptive_icon_foreground: "assets/icon/icon-adaptive-foreground-white.png"
  # Logo already padded ~18%+ for adaptive safe zone; do not inset further.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - brand.txt
    - assets/legal/
