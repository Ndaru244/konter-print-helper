org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# System Java 25 is a JRE without javac. Use the JDK that launches Gradle.
org.gradle.java.installations.auto-detect=false
android.enableJetifier=true
# Keep false until plugins stop applying org.jetbrains.kotlin.android.
# AGP 9 otherwise refuses those plugins (blue_thermal_printer, share_plus, shared_preferences).
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
